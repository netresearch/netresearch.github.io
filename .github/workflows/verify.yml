name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # The data files are build artefacts, not repository content, so a PR
      # build fetches them exactly as the deploy build does. Verifying against
      # anything else would verify a page nobody will ever be served.
      - name: Refresh repository, manifest and impact data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-data

      - run: npm run build

      # `npm ci --ignore-scripts` deliberately skips puppeteer's postinstall, so
      # the browser axe needs is fetched here instead — explicitly, and at the
      # version puppeteer pins. The locally installed binary is called directly
      # rather than through npx, which would install a package on demand and run
      # its lifecycle scripts.
      - name: Install the browser for the accessibility audit
        run: ./node_modules/.bin/puppeteer browsers install chrome

      - name: Verify built site and run axe
        run: npm run verify

      - name: Type-check
        run: npm run check
