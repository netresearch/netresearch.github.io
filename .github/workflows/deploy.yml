name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Both jobs are shared-reusable calls: this workflow has zero step-level
  # `uses:`. Every action (checkout, setup-node, upload-artifact,
  # upload-pages-artifact, deploy-pages, harden-runner) now lives in
  # netresearch/.github.
  build:
    uses: netresearch/.github/.github/workflows/pages-build.yml@main
    permissions:
      contents: read
    with:
      setup-node: true
      node-version: '22'
      # Dependency install stays in the token-free phase on purpose: this is
      # where third-party npm lifecycle scripts would run — so they do not run
      # at all.
      pre-build-command: npm ci --ignore-scripts
      # `npm run fetch-data` calls the GitHub API for repository metadata and
      # for each product's latest release, so GH_TOKEN must exist in THIS phase
      # — that is what `expose-github-token: build` provides. The reusable
      # scopes the token per PHASE. It is dropped again before the site build,
      # so the astro build and the gate stay token-free.
      build-command: |
        npm run fetch-data
        unset GITHUB_TOKEN GH_TOKEN
        npm run build
        ./node_modules/.bin/puppeteer browsers install chrome
        npm run verify
      expose-github-token: build
      # astro.config.mjs hardcodes `site:` and never reads PAGES_BASE_PATH /
      # PAGES_ORIGIN, and the previous build job never ran configure-pages.
      configure-pages: false
      artifact-path: dist

  deploy:
    needs: build
    uses: netresearch/.github/.github/workflows/pages-deploy.yml@main
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      artifact-path: ./dist
