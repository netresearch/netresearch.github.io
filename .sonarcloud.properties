# src/i18n holds the English and German content dictionaries. They have the same
# key structure by definition — that is what makes them translations of each
# other — so the copy-paste detector reports the file as ~78% duplicated. It is a
# translation table, not copied logic, and merging the two would make the pages
# monolingual.
#
# Duplication analysis only. Every other rule still applies to these files.
sonar.cpd.exclusions=src/i18n/**
